version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /f1-pitwall-client
    schedule: { interval: weekly }
    groups:
      # react-dom peers on the exact react minor, so they must move together (a lone
      # react-dom bump fails npm ci with ERESOLVE).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /f1-pitwall-client
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
