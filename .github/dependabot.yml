# Kept quiet on purpose: one monthly pull request per ecosystem for minor/patch updates.
# Major versions (and non-LTS base images) are upgraded by hand when wanted, not proposed.
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /f1-pitwall-client
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      # react-dom peers on the exact react minor, so they must move together (a lone
      # react-dom bump fails npm ci with ERESOLVE). Listed first so it wins over the catch-all.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /f1-pitwall-client
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
