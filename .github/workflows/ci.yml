name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Java 21 + Maven ────────────────────────────────────────────
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real PostgreSQL for the Flyway migration test below (the other tests use H2).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: f1_pitwall_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build & unit tests
        run: ./mvnw --batch-mode test -Dspring.profiles.active=test
        env:
          JWT_SECRET: ci-test-secret-key-with-at-least-32-chars

      - name: Flyway migrations + schema validation on PostgreSQL
        run: ./mvnw --batch-mode test -Dtest=FlywayPostgresMigrationTest -Dspring.profiles.active=test
        env:
          JWT_SECRET: ci-test-secret-key-with-at-least-32-chars
          PG_TEST_URL: jdbc:postgresql://localhost:5432/f1_pitwall_db

      - name: OSIV=false regression guard
        run: ./mvnw --batch-mode test -Dtest=OpenInViewRegressionTest -Dspring.profiles.active=test,ci
        env:
          JWT_SECRET: ci-test-secret-key-with-at-least-32-chars

      - name: Compile sanity check
        run: ./mvnw --batch-mode compile -DskipTests

  # ── Frontend: Next.js ───────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1-pitwall-client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: f1-pitwall-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx next build

  # ── Docker: images must build (catches broken COPY paths, missing lockfile entries) ──
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t f1-pitwall-backend ./backend

      - name: Build frontend image
        run: docker build -t f1-pitwall-client ./f1-pitwall-client
