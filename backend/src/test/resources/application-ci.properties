# ── CI regression safety net ─────────────────────────────────────────────────
# This profile exists for ONE purpose: to catch LazyInitializationException
# regressions in CI before they reach production.
#
# Production (application-prod.properties) sets spring.jpa.open-in-view=false.
# Every @ManyToOne / @OneToMany access that leaks outside a @Transactional
# boundary will throw LazyInitializationException under this config.
#
# The OpenInViewRegressionTest suite hits every entity-returning GET endpoint
# and asserts HTTP 200. If any endpoint returns 500 because a lazy proxy
# couldn't initialize, CI fails.
#
# DO NOT set open-in-view=true here — that would defeat the entire purpose.
spring.jpa.open-in-view=false
