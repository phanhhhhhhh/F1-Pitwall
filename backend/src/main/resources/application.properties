server.port=8080

# Default @Scheduled pool is a single thread; with several scheduled jobs the long-running
# OpenF1 sync would otherwise starve the 1s-tick telemetry broadcast.
spring.task.scheduling.pool.size=4

spring.datasource.url=jdbc:postgresql://localhost:5432/f1_pitwall_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


# Flyway owns the schema. Hibernate only validates that the entities match what the
# migrations built — it never issues DDL. Schema changes go in a new V<n>__*.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# V1__baseline.sql is a pg_dump of the schema the old ddl-auto=update pass had built;
# baseline-on-migrate lets Flyway adopt an already-populated DB without erroring on a
# non-empty schema (it records V1 as applied and runs V2 onward).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=86400000



spring.security.oauth2.client.registration.google.client-id=dummy-local
spring.security.oauth2.client.registration.google.client-secret=dummy-local
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Resend email API (https://resend.com) — set RESEND_API_KEY in environment
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}
